spring:
  mail:
    host: ${SPRING_MAIL_HOST:${AWS_SES_SMTP_HOST:mailpit}}
    port: ${SPRING_MAIL_PORT:${AWS_SES_SMTP_PORT:1025}}
    username: ${AWS_SES_SMTP_USERNAME:}
    password: ${AWS_SES_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${AMAZON_MSK_BOOTSTRAP_SERVERS:kafka:29092}}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}

logging:
  level:
    root: INFO
    com.ecommerce: INFO

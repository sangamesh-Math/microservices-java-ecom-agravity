spring:
  mail:
    host: ${SPRING_MAIL_HOST:${AWS_SES_SMTP_HOST:mailpit}}
    port: ${SPRING_MAIL_PORT:${AWS_SES_SMTP_PORT:1025}}
    username: ${AWS_SES_SMTP_USERNAME:}
    password: ${AWS_SES_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${AMAZON_MSK_BOOTSTRAP_SERVERS:kafka:29092}}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.ecommerce.common.event.OrderCreatedEvent
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}

logging:
  level:
    root: INFO
    com.ecommerce: INFO

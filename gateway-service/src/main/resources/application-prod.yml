spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:*}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service-public
          uri: ${AUTH_SERVICE_URL:http://auth-user-service:8081}
          predicates:
            - Path=/api/auth/**
        - id: user-service-protected
          uri: ${AUTH_SERVICE_URL:http://auth-user-service:8081}
          predicates:
            - Path=/api/users/**
          filters:
            - JwtAuthenticationFilter
        - id: catalog-service-public
          uri: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
          predicates:
            - Path=/api/products/**
            - Method=GET
        - id: catalog-service-protected
          uri: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
          predicates:
            - Path=/api/products/**
            - Method=POST,PUT,DELETE
          filters:
            - JwtAuthenticationFilter
        - id: cart-service
          uri: ${CART_SERVICE_URL:http://cart-service:8083}
          predicates:
            - Path=/api/cart/**
          filters:
            - JwtAuthenticationFilter
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://order-service:8084}
          predicates:
            - Path=/api/orders/**
          filters:
            - JwtAuthenticationFilter
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
          predicates:
            - Path=/api/notifications/**

jwt:
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==}


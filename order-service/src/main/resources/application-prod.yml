spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${AWS_RDS_ENDPOINT:postgres}:5432/${DB_NAME:order_db}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${AMAZON_MSK_BOOTSTRAP_SERVERS:kafka:29092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}

services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
  cart:
    url: ${CART_SERVICE_URL:http://cart-service:8083}

logging:
  level:
    root: INFO
    com.ecommerce: INFO
